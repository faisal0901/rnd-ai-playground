<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn AI Playground</title>
<style>
  :root {
    --bg: #f5f7fb; --card: #ffffff; --text: #1d2433; --muted: #667085; --line: #e3e7ef;
    --brand: #0f766e; --brand-soft: #e0f2f1; --user: #dff3ef; --code-bg: #0f172a; --code-text: #e2e8f0;
    --ok: #166534; --bad: #b42318; --bad-soft: #fef3f2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e131b; --card: #161d29; --text: #e6eaf2; --muted: #9aa5b8; --line: #263043;
      --brand: #2dd4bf; --brand-soft: #12302d; --user: #14352f; --code-bg: #0a0f17; --code-text: #dbe4f0;
      --ok: #4ade80; --bad: #f97066; --bad-soft: #2a1614;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
  header a { margin-left: auto; color: var(--brand); text-decoration: none; font-weight: 600; font-size: 14px; }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .column { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .bubble { padding: 10px 14px; border-radius: 14px; max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--user); }
  .assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
  .error { align-self: flex-start; background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
  .tool { align-self: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tool summary { cursor: pointer; padding: 8px 14px; font-size: 14px; color: var(--muted); }
  .tool pre { margin: 0; padding: 12px 14px; background: var(--code-bg); color: var(--code-text); font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
              overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tool .status { font-weight: 600; }
  .tool .ok { color: #4ade80; } .tool .bad { color: #f97066; }   /* on the dark code block, in light and dark mode */
  .empty { text-align: center; color: var(--muted); margin-top: 18vh; }
  .empty button { margin: 6px 4px; }
  form { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  form .row { max-width: 760px; margin: 0 auto; width: 100%; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); }
  button { font: inherit; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .chips { max-width: 760px; margin: 0 auto; width: 100%; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 6px 2px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
  .chip button { padding: 0 6px; border: none; background: none; color: inherit; font-size: 16px; line-height: 1; border-radius: 999px; }
  .bubble .attached { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Learn AI Playground</h1>
  <span class="badge" id="mode">…</span>
  <a href="/kb" title="Dokumen di sini disimpan dan di-embed untuk dicari">Knowledge base</a>
  <button id="reset" type="button">Chat baru</button>
</header>
<main id="scroll"><div class="column" id="chat"></div></main>
<form id="form">
  <div class="chips" id="chips"></div>
  <div class="row">
    <input type="file" id="fileInput" multiple accept=".md,.txt,.csv,.json,.log,.pdf" hidden>
    <button id="attach" type="button" title="Lampirkan file untuk percakapan ini saja. Tidak disimpan dan tidak di-embed.">Lampirkan</button>
    <textarea id="input" rows="1" title="Enter kirim, Shift+Enter baris baru" placeholder="Tulis pesan…" autofocus></textarea>
    <button class="primary" id="send" type="submit">Kirim</button>
  </div>
</form>

<script>
// The browser keeps the conversation. Every request sends all of it; the server remembers nothing.
let transcript = [];
let busy = false;

const chat = document.getElementById("chat");
const scroller = document.getElementById("scroll");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");
const chips = document.getElementById("chips");
const fileInput = document.getElementById("fileInput");

// A chat attachment is only read: the server returns its text and keeps nothing. The text rides along in this
// conversation's messages (and is cut at 30,000 characters). To keep a file and make it searchable, use /kb.
let attachments = [];   // [{name, text, chars, truncated}]
let uploading = false;

function renderChips() {
  chips.replaceChildren();
  attachments.forEach((file, index) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.append(`${file.name} · ${file.chars.toLocaleString("id-ID")} karakter${file.truncated ? " (dipotong)" : ""}`);
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "×";
    remove.setAttribute("aria-label", `Buang ${file.name}`);
    remove.onclick = () => { attachments.splice(index, 1); renderChips(); };
    chip.append(remove);
    chips.append(chip);
  });
}

async function attachFiles(files) {
  uploading = true; sendButton.disabled = true;
  for (const file of files) {
    try {
      const body = new FormData();
      body.append("file", file);
      const response = await fetch("/api/attach", { method: "POST", body });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : response.statusText);
      attachments.push(data);
    } catch (error) {
      el("div", "bubble error", `${file.name}: ${error.message}`);
    }
  }
  renderChips();
  uploading = false; sendButton.disabled = busy;
}

document.getElementById("attach").onclick = () => fileInput.click();
fileInput.addEventListener("change", () => { attachFiles([...fileInput.files]); fileInput.value = ""; });

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;   // textContent, never innerHTML: model output is untrusted
  chat.appendChild(node);
  scroller.scrollTop = scroller.scrollHeight;
  return node;
}

function showEmpty() {
  const box = el("div", "empty");
  box.append("Coba salah satu, atau tulis sendiri:");
  box.append(document.createElement("br"));
  for (const text of ["Hitung jumlah 1 sampai 100 pakai python", "Cari di dokumen: kopi saya terasa pahit", "Halo, kamu siapa?"]) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = text;
    button.onclick = () => send(text);
    box.appendChild(button);
  }
}

function toolCard(name, code) {
  const card = el("details", "tool");
  card.open = true;
  card.appendChild(Object.assign(document.createElement("summary"), { textContent: `Tool: ${name}` }));
  card.appendChild(Object.assign(document.createElement("pre"), { textContent: code }));
  return card;
}

function showResult(card, result) {
  const status = document.createElement("pre");
  const hits = result.results;                // a search_docs result has hits; a run_python result has stdout/stderr
  const label = result.error ? "error" : hits ? `${hits.length} hasil` : result.timed_out ? "timeout" : `exit ${result.exit_code}`;
  const head = document.createElement("span");
  head.className = "status " + (result.ok ? "ok" : "bad");
  head.textContent = label;
  status.appendChild(head);
  const body = result.error
    || (hits ? hits.map((h) => `${h.score.toFixed(3)}  ${h.source} #${h.chunk}\n${h.text}`).join("\n\n")
             : [result.stdout, result.stderr].filter(Boolean).join("\n"));
  status.append(body ? "\n" + body : "");
  card.appendChild(status);
}

async function send(text) {
  text = (text || "").trim();
  if ((!text && !attachments.length) || busy || uploading) return;
  const files = attachments; attachments = []; renderChips();
  if (!text) text = "Tolong baca lampiran ini.";
  busy = true; sendButton.disabled = true; input.value = "";
  chat.querySelector(".empty")?.remove();
  const mine = el("div", "bubble user", text);
  for (const file of files) mine.append(Object.assign(document.createElement("span"), { className: "attached", textContent: `Lampiran: ${file.name}` }));
  // What the model receives: your text, then each file wrapped in a tag so it can tell them apart.
  const content = text + files.map((f) => `\n\n<attachment name="${f.name}">\n${f.text}\n</attachment>`).join("");
  transcript.push({ role: "user", content });

  let bubble = null, card = null;            // the text bubble being written, and the tool card waiting for its result
  try {
    const response = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: transcript }),
    });
    const reader = response.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let end;
      while ((end = buffer.indexOf("\n\n")) >= 0) {   // one complete event
        const line = buffer.slice(0, end).replace(/^data: /, ""); buffer = buffer.slice(end + 2);
        const event = JSON.parse(line);
        if (event.kind === "text") {
          bubble = bubble || el("div", "bubble assistant");
          bubble.textContent += event.text;
        } else if (event.kind === "tool_call") {
          bubble = null; card = toolCard(event.name, event.input.code ?? event.input.query ?? JSON.stringify(event.input, null, 2));
        } else if (event.kind === "tool_result") {
          if (card) showResult(card, event.result);
          card = null;
        } else if (event.kind === "done") {
          transcript = event.messages;
        } else if (event.kind === "error") {
          el("div", "bubble error", event.message);
        }
        scroller.scrollTop = scroller.scrollHeight;
      }
    }
  } catch (error) {
    el("div", "bubble error", "Gagal menghubungi server: " + error.message);
  }
  busy = false; sendButton.disabled = false; input.focus();
}

document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); } });
document.getElementById("reset").onclick = () => { if (busy) return; attachments = []; renderChips(); transcript = []; chat.innerHTML = ""; showEmpty(); };

fetch("/api/health").then(r => r.json()).then(h => {
  document.getElementById("mode").textContent = h.mode === "demo" ? "mode demo (tanpa API key)" : "model asli";
});
showEmpty();
</script>
</body>
</html>
